name: Проверки основы LoanFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  technical:
    name: Документация, PostgreSQL, прототип и HTTP-сервисы
    runs-on: ubuntu-24.04
    env:
      PG_BINDIR: /usr/lib/postgresql/18/bin
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-checks.txt
            requirements-checks.lock.txt
            requirements-docs.txt
            services/requirements.txt
            services/requirements.lock.txt
      - run: python -m pip install -r requirements-checks.txt
      - name: PostgreSQL 18 из официального репозитория
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 fonts-dejavu-core
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/check.py --technical
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-results
          path: test-results/
  contracts:
    name: Контрактные примеры OpenAPI
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-checks.txt
            requirements-checks.lock.txt
            requirements-docs.txt
            services/requirements.txt
            services/requirements.lock.txt
      - run: python -m pip install -r requirements-checks.txt
      - run: python -m pytest -q --tb=short -m contracts --require-ready --junitxml=test-results/contracts.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: contract-results
          path: test-results/
  kafka:
    name: Kafka и разделённый сервис оценки
    runs-on: ubuntu-24.04
    env:
      PG_BINDIR: /usr/lib/postgresql/18/bin
      KAFKA_HOME: ${{ github.workspace }}/.cache/kafka_2.13-4.1.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-checks.txt
      - name: PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 fonts-dejavu-core
      - name: Apache Kafka 4.1.1
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 https://archive.apache.org/dist/kafka/4.1.1/kafka_2.13-4.1.1.tgz -o .cache/kafka.tgz
          curl --fail --location --retry 3 https://archive.apache.org/dist/kafka/4.1.1/kafka_2.13-4.1.1.tgz.sha512 -o .cache/kafka.tgz.sha512
          python scripts/verify_kafka_archive.py .cache/kafka.tgz .cache/kafka.tgz.sha512
          tar -xzf .cache/kafka.tgz -C .cache
      - run: python -m pytest -q --tb=short tests/test_kafka.py --require-kafka --junitxml=test-results/kafka.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kafka-results
          path: test-results/
  camunda:
    name: Camunda 8 Run, PostgreSQL и Kafka без Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PG_BINDIR: /usr/lib/postgresql/18/bin
      KAFKA_HOME: ${{ github.workspace }}/.cache/kafka_2.13-4.1.1
      CAMUNDA_HOME: ${{ github.workspace }}/.cache/camunda-8.10.9/c8run-8.10.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-checks.txt
      - name: PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 fonts-dejavu-core
      - name: Apache Kafka 4.1.1
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 https://archive.apache.org/dist/kafka/4.1.1/kafka_2.13-4.1.1.tgz -o .cache/kafka.tgz
          curl --fail --location --retry 3 https://archive.apache.org/dist/kafka/4.1.1/kafka_2.13-4.1.1.tgz.sha512 -o .cache/kafka.tgz.sha512
          python scripts/verify_kafka_archive.py .cache/kafka.tgz .cache/kafka.tgz.sha512
          tar -xzf .cache/kafka.tgz -C .cache
      - name: Camunda 8 Run 8.10.9 и закреплённая SHA-256
        run: python scripts/prepare_camunda.py
      - name: Проверка compose overlay
        env:
          LOANFLOW_MONITOR_TOKEN: ci-monitor-config-validation
          LOANFLOW_SECRET: ci-config-validation
          LOANFLOW_ABS_TOKEN: ci-config-validation
          LOANFLOW_ASSESSMENT_TOKEN: ci-config-validation
          LOANFLOW_ASSESSMENT_SECRET: ci-config-validation
        run: docker compose -f compose.yaml -f compose.camunda.yaml config --quiet
      - name: Приёмка 5.4 с обязательными настоящими движком и брокером
        run: |
          mkdir -p test-results
          python -m pytest -q --tb=short tests/test_camunda.py --require-camunda --require-kafka --basetemp=test-results/camunda-runtime --junitxml=test-results/camunda.xml
      - name: Сборка образа и проверка ресурсов оценки
        run: |
          docker build -f services/Dockerfile -t loanflow-stand:ci .
          docker run --rm loanflow-stand:ci python -c 'from services.loanflow import event_bus, store; import xml.etree.ElementTree as E; event_bus.validator(event_bus.REQUEST_TOPIC); event_bus.validator(event_bus.RESULT_TOPIC); E.parse(store.ROOT / "diagrams/loanflow-assessment.bpmn")'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: camunda-results
          path: |
            test-results/camunda.xml
            test-results/camunda-runtime/**/run.log
            test-results/camunda-runtime/**/camunda.log

  nfr:
    needs: camunda
    name: НФТ — три последовательных прогона полного конвейера
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PG_BINDIR: /usr/lib/postgresql/18/bin
      KAFKA_HOME: ${{ github.workspace }}/.cache/kafka_2.13-4.1.1
      CAMUNDA_HOME: ${{ github.workspace }}/.cache/camunda-8.10.9/c8run-8.10.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python -m pip install -r requirements-checks.txt
      - name: PostgreSQL 18
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-18 fonts-dejavu-core
      - name: Apache Kafka 4.1.1
        run: |
          mkdir -p .cache
          curl --fail --location --retry 3 https://archive.apache.org/dist/kafka/4.1.1/kafka_2.13-4.1.1.tgz -o .cache/kafka.tgz
          curl --fail --location --retry 3 https://archive.apache.org/dist/kafka/4.1.1/kafka_2.13-4.1.1.tgz.sha512 -o .cache/kafka.tgz.sha512
          python scripts/verify_kafka_archive.py .cache/kafka.tgz .cache/kafka.tgz.sha512
          tar -xzf .cache/kafka.tgz -C .cache
      - name: Camunda 8 Run 8.10.9 и закреплённая SHA-256
        run: python scripts/prepare_camunda.py
      - name: Приёмка согласованных целей 5.5
        run: python scripts/measure_nfr.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nfr-results
          path: test-results/nfr.json
          if-no-files-found: error
