site_name: LoanFlow
site_description: Учебный кредитный конвейер для потребительских кредитов
docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Светлая тема

plugins:
  - search:
      lang:
        - ru
        - en

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Главная: index.md
  - Проверки перед реализацией: verification.md
  - Бизнес-контекст:
      - 01-business/index.md
      - Протокол интервью: 01-business/1.1-interview-protocol.md
      - Протокол эскалации: 01-business/1.1.1-escalation-protocol.md
      - Глоссарий и регуляторика: 01-business/1.2-glossary-and-regulations.md
      - Vision & Scope (BRD): 01-business/1.3-brd.md
      - Реестр открытых вопросов: 01-business/action-tracker.md
  - Процессы:
      - 02-processes/index.md
      - Статусная модель: 02-processes/1.5-status-model.md
  - Требования:
      - 03-requirements/index.md
      - 1.6. Требования MVP: 03-requirements/1.6-mvp-requirements.md
      - 3.3. Постановки задач: 03-requirements/3.3-calculation-tasks.md
  - Модель данных:
      - 04-data/index.md
      - 2.1. Логическая ER-модель: 04-data/2.1-logical-er-model.md
      - 2.2. Физическая модель данных и DDL PostgreSQL: 04-data/2.2-physical-model-postgresql.md
      - 2.4. SQL-практикум: 04-data/2.4-sql-practicum.md
  - API:
      - 05-api/index.md
      - 2.3. API и OpenAPI-контракт: 05-api/2.3-openapi-contract.md
  - Интеграции:
      - 06-integrations/index.md
      - 4.1. Интеграционная архитектура:
          - 06-integrations/4.1-integration-architecture.md
          - Оценка заявки: 06-integrations/4.1-application-assessment.md
          - Выдача через учебную АБС: 06-integrations/4.1-abs-disbursement.md
      - 4.2. Маппинги полей: 06-integrations/4.2-field-mappings.md
      - Контракт учебной АБС: 06-integrations/abs-contract.md
  - Архитектура:
      - 07-architecture/index.md
      - 5.1. Декомпозиция LoanFlow: 07-architecture/5.1-service-decomposition.md
      - 5.2. Событийная модель оценки: 07-architecture/5.2-assessment-events.md
      - 5.4. Оркестрация оценки в Camunda: 07-architecture/5.4-assessment-orchestration.md
  - 1.7. Прототипы: 08-prototypes/index.md
  - Архитектурные решения: decisions/index.md
