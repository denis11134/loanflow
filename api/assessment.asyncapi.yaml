asyncapi: 3.1.0
info:
  title: LoanFlow · Обмен с сервисом оценки
  version: 1.0.0
  description: >
    Контракт Kafka учебного стенда со стороны ядра LoanFlow.
    Ядро отправляет задание и принимает результат оценки.
    Сервис оценки читает задания и публикует результаты.
    В обмене используются только синтетические данные.
defaultContentType: application/json
channels:
  assessmentRequests:
    address: loanflow.assessment.requests.v1
    description: Ядро публикует одно задание на принятую подачу. Сервис оценки читает задания.
    messages:
      assessmentRequested:
        $ref: '#/components/messages/AssessmentRequested'
  assessmentResults:
    address: loanflow.assessment.results.v1
    description: Сервис оценки публикует окончательный исход оценки. Ядро читает результаты.
    messages:
      assessmentCompleted:
        $ref: '#/components/messages/AssessmentCompleted'
operations:
  sendAssessmentRequest:
    action: send
    channel:
      $ref: '#/channels/assessmentRequests'
    messages:
      - $ref: '#/channels/assessmentRequests/messages/assessmentRequested'
  receiveAssessmentResult:
    action: receive
    channel:
      $ref: '#/channels/assessmentResults'
    messages:
      - $ref: '#/channels/assessmentResults/messages/assessmentCompleted'
components:
  correlationIds:
    application:
      description: Идентификатор заявки. Для каждой заявки существует одна принятая подача.
      location: '$message.payload#/application_id'
  messages:
    AssessmentRequested:
      name: AssessmentRequested
      summary: Запустить оценку по исходной подаче
      correlationId:
        $ref: '#/components/correlationIds/application'
      bindings:
        kafka:
          bindingVersion: '0.5.0'
          key:
            $ref: '#/components/schemas/Identifier'
      payload:
        $ref: '#/components/schemas/AssessmentRequest'
      examples:
        - name: submittedApplication
          payload:
            message_id: '30000000-0000-4000-8000-000000000001'
            application_id: '20000000-0000-4000-8000-000000000001'
            submitted_at: '2026-11-17T08:00:00Z'
            inputs:
              customer_id: '10000000-0000-0000-0000-000000000001'
              requested_amount_minor: '5000000'
              requested_term_months: 12
              rules_version: '3.3'
              profile_version_ref: stand-profile-1
              aml_block: false
              consent:
                state: GRANTED
                consent_ref: stand-consent-1
              payroll_income:
                state: AVAILABLE
                amount_minor: '5500000'
              quota_ref:
                period: demo
                bucket: standard
    AssessmentCompleted:
      name: AssessmentCompleted
      summary: Вернуть окончательный исход оценки
      correlationId:
        $ref: '#/components/correlationIds/application'
      bindings:
        kafka:
          bindingVersion: '0.5.0'
          key:
            $ref: '#/components/schemas/Identifier'
      payload:
        $ref: '#/components/schemas/AssessmentResult'
      examples:
        - name: recommendApproval
          payload:
            message_id: '40000000-0000-4000-8000-000000000001'
            application_id: '20000000-0000-4000-8000-000000000001'
            submitted_at: '2026-11-17T08:00:00Z'
            result:
              outcome: RECOMMEND_APPROVAL
              terms:
                annual_rate_percent: '20'
                monthly_payment_minor: '463173'
                psk_annual_percent: '20.000006146107'
                psk_rub: '5580.70'
              psk_limit_exceeded: false
              quota_ref:
                period: demo
                bucket: standard
              pdn_notice_required: true
        - name: manualReview
          summary: Те же расчётные условия при ручном рассмотрении по вердикту антифрода
          payload:
            message_id: '40000000-0000-4000-8000-000000000002'
            application_id: '20000000-0000-4000-8000-000000000002'
            submitted_at: '2026-11-17T08:05:00Z'
            result:
              outcome: MANUAL_REVIEW
              terms:
                annual_rate_percent: '20'
                monthly_payment_minor: '463173'
                psk_annual_percent: '20.000006146107'
                psk_rub: '5580.70'
              psk_limit_exceeded: false
              quota_ref:
                period: demo
                bucket: standard
              pdn_notice_required: true
        - name: selfBan
          payload:
            message_id: '40000000-0000-4000-8000-000000000003'
            application_id: '20000000-0000-4000-8000-000000000003'
            submitted_at: '2026-11-17T08:10:00Z'
            result:
              outcome: BUSINESS_REJECTED
              reason_code: SELF_BAN
        - name: invalidSource
          payload:
            message_id: '40000000-0000-4000-8000-000000000004'
            application_id: '20000000-0000-4000-8000-000000000004'
            submitted_at: '2026-11-17T08:15:00Z'
            result:
              outcome: TECHNICAL_FAILURE
              failure_kind: PERMANENT
        - name: checksTimedOut
          payload:
            message_id: '40000000-0000-4000-8000-000000000005'
            application_id: '20000000-0000-4000-8000-000000000005'
            submitted_at: '2026-11-17T08:20:00Z'
            result:
              outcome: TECHNICAL_FAILURE
              failure_kind: RETRIES_EXHAUSTED
  schemas:
    Identifier:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?![\s\S])'
      description: UUID в канонической записи строчными буквами. Ключ Kafka равен application_id.
    SubmittedAt:
      type: string
      format: date-time
      description: Зафиксированный момент исходной подачи, сохраняемый при всех повторах.
    Reference:
      type: string
      pattern: '\S'
    NonnegativeMinor:
      type: string
      pattern: '^(0|[1-9][0-9]*)(?![\s\S])'
    PositiveMinor:
      type: string
      pattern: '^[1-9][0-9]*(?![\s\S])'
    AnnualRate:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?(?![\s\S])'
    AnnualPsk:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.[0-9]{12}(?![\s\S])'
    PskRub:
      type: string
      pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}(?![\s\S])'
    QuotaReference:
      type: object
      additionalProperties: false
      required: [period, bucket]
      properties:
        period:
          $ref: '#/components/schemas/Reference'
        bucket:
          $ref: '#/components/schemas/Reference'
    ConsentInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state, consent_ref]
          properties:
            state:
              const: GRANTED
            consent_ref:
              $ref: '#/components/schemas/Reference'
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              enum: [ABSENT, INVALID_SOURCE]
    PayrollIncomeInput:
      oneOf:
        - type: object
          additionalProperties: false
          required: [state, amount_minor]
          properties:
            state:
              const: AVAILABLE
            amount_minor:
              $ref: '#/components/schemas/NonnegativeMinor'
        - type: object
          additionalProperties: false
          required: [state]
          properties:
            state:
              enum: [UNCONFIRMED, INVALID_SOURCE]
    AssessmentRequest:
      type: object
      additionalProperties: false
      required: [message_id, application_id, submitted_at, inputs]
      properties:
        message_id:
          $ref: '#/components/schemas/Identifier'
        application_id:
          $ref: '#/components/schemas/Identifier'
        submitted_at:
          $ref: '#/components/schemas/SubmittedAt'
        inputs:
          $ref: '#/components/schemas/AssessmentInputs'
    AssessmentInputs:
      type: object
      additionalProperties: false
      required:
        - customer_id
        - requested_amount_minor
        - requested_term_months
        - rules_version
        - profile_version_ref
        - aml_block
        - consent
        - payroll_income
        - quota_ref
      properties:
        customer_id:
          $ref: '#/components/schemas/Identifier'
        requested_amount_minor:
          type: string
          description: Целое число копеек в диапазоне продукта 3.3.
          pattern: '^(?:[1-9][0-9]{5,7}|100000000)(?![\s\S])'
        requested_term_months:
          type: integer
          minimum: 1
          maximum: 60
        rules_version:
          $ref: '#/components/schemas/Reference'
        profile_version_ref:
          $ref: '#/components/schemas/Reference'
        aml_block:
          type: boolean
        consent:
          $ref: '#/components/schemas/ConsentInput'
        payroll_income:
          $ref: '#/components/schemas/PayrollIncomeInput'
        quota_ref:
          description: Ключ из профиля. Null обозначает отсутствующий или некорректный ключ источника.
          anyOf:
            - $ref: '#/components/schemas/QuotaReference'
            - type: 'null'
    AssessmentResult:
      type: object
      additionalProperties: false
      required: [message_id, application_id, submitted_at, result]
      properties:
        message_id:
          $ref: '#/components/schemas/Identifier'
        application_id:
          $ref: '#/components/schemas/Identifier'
        submitted_at:
          $ref: '#/components/schemas/SubmittedAt'
        result:
          oneOf:
            - $ref: '#/components/schemas/Recommendation'
            - $ref: '#/components/schemas/BusinessRejection'
            - $ref: '#/components/schemas/TechnicalFailure'
    Recommendation:
      type: object
      additionalProperties: false
      required: [outcome, terms, psk_limit_exceeded, quota_ref, pdn_notice_required]
      properties:
        outcome:
          enum: [RECOMMEND_APPROVAL, MANUAL_REVIEW]
        terms:
          $ref: '#/components/schemas/CalculatedTerms'
        psk_limit_exceeded:
          type: boolean
          description: Результат точного сравнения с пределом ПСК. При равенстве false.
        quota_ref:
          $ref: '#/components/schemas/QuotaReference'
        pdn_notice_required:
          type: boolean
          description: Результат точного сравнения ПДН с 50%. При равенстве false.
    CalculatedTerms:
      type: object
      description: Ставка, платёж и ПСК. Сумма и срок берутся из снимка исходной подачи.
      additionalProperties: false
      required: [annual_rate_percent, monthly_payment_minor, psk_annual_percent, psk_rub]
      properties:
        annual_rate_percent:
          $ref: '#/components/schemas/AnnualRate'
        monthly_payment_minor:
          $ref: '#/components/schemas/PositiveMinor'
        psk_annual_percent:
          $ref: '#/components/schemas/AnnualPsk'
        psk_rub:
          $ref: '#/components/schemas/PskRub'
    BusinessRejection:
      type: object
      additionalProperties: false
      required: [outcome, reason_code]
      properties:
        outcome:
          const: BUSINESS_REJECTED
        reason_code:
          enum:
            - AML_BLOCK
            - PASSPORT_INVALID
            - CREDIT_REPORT_CONSENT_REQUIRED
            - SELF_BAN
            - NO_CONFIRMED_INCOME
            - SCORING_BELOW_THRESHOLD
    TechnicalFailure:
      type: object
      additionalProperties: false
      required: [outcome, failure_kind]
      properties:
        outcome:
          const: TECHNICAL_FAILURE
        failure_kind:
          enum: [PERMANENT, RETRIES_EXHAUSTED]
