      summary: Прочитать результат зарегистрированного чтения
      description: Последнее чтение для допуска закрытия определяется максимальным зарегистрированным read_seq. Чтение отдельного
        результата допуск не меняет.
      x-roles:
      - RECONCILIATION_OPERATOR
      x-requirements:
      - FR-UC07-01
      - FR-UC07-02
      parameters:
      - $ref: '#/components/parameters/instruction_id'
      - $ref: '#/components/parameters/read_seq'
