openapi: 3.0.3
info:
  title: LoanFlow · API учебного MVP
  version: 1.0.0
  description: API мобильного приложения и рабочих мест. Роль, личность и контекст определяются доверенным токеном. Политика
    повторов и связь с внутренними операциями описаны в главе 2.3.
security:
- StandBearer: []
paths:
  /applications:
    post:
      operationId: createDraft
      tags:
      - CUSTOMER
      summary: Создать черновик
      description: Сумма и срок необязательны. Повтор с тем же ключом возвращает первый результат и тот же идентификатор.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC02-01
      - FR-UC06-01
      parameters:
      - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftInput'
      responses:
        '201':
          description: Черновик создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationView'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна или ключ уже использован для другого тела.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - IDEMPOTENCY_KEY_REUSED
    get:
      operationId: listOwnApplications
      tags:
      - CUSTOMER
      summary: Список своих заявок
      description: Выборка привязана к клиенту из токена.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC06-01
      responses:
        '200':
          description: Собственные заявки.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApplicationView'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '503':
          $ref: '#/components/responses/Http503'
  /applications/{application_id}:
    get:
      operationId: getOwnApplication
      tags:
      - CUSTOMER
      summary: Прочитать текущую заявку
      description: Текущий статус и допустимые действия. Подготовка ИУ отличается от их доступности. Код причины банка и балл
        скоринга не возвращаются.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC06-01
      - FR-UC03-01
      - FR-UC03-02
      - FR-UC03-03
      - FR-UC05-03
      parameters:
      - $ref: '#/components/parameters/application_id'
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationView'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
    patch:
      operationId: updateDraft
      tags:
      - CUSTOMER
      summary: Обновить черновик
      description: Редактирование только в DRAFT. Пропущенные поля сохраняются. null очищает переданное поле.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC02-01
      - FR-UC06-01
      parameters:
      - $ref: '#/components/parameters/application_id'
      - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DraftPatch'
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationView'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна или ключ уже использован для другого тела.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - DRAFT_REQUIRED
                      - IDEMPOTENCY_KEY_REUSED
  /applications/{application_id}/submission:
    post:
      operationId: submitApplication
      tags:
      - CUSTOMER
      summary: Подать заявку
      description: У принятой подачи повтор всегда возвращает исходные идентификатор, время и SCORING, даже после смены статуса.
        Новая подача проверяет сумму от 100000 до 100000000 копеек и срок от 1 до 60 месяцев включительно
        после проверки обязательных полей. При выходе за диапазон Заявка остаётся в DRAFT.
        Текущий статус читается отдельно. Конкурирующая подача по клиенту проверяется после сериализации.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC02-01
      - FR-UC02-02
      parameters:
      - $ref: '#/components/parameters/application_id'
      responses:
        '202':
          description: Подача принята. Оценка запущена один раз.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionReceipt'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна в текущем состоянии.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - APPLICATION_STATE_CONFLICT
                      - BLOCKING_APPLICATION_OR_CONTRACT
        '422':
          description: Запрос корректен по формату, но нарушает условия сценария.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - REQUIRED_FIELDS_MISSING
                      - APPLICATION_PARAMETERS_OUT_OF_RANGE
                      - CUSTOMER_NOT_ELIGIBLE
  /applications/{application_id}/cancellation:
    post:
      operationId: cancelApplication
      tags:
      - CUSTOMER
      summary: Отменить заявку
      description: Первый допустимый переход освобождает имеющийся резерв. Повтор для CLIENT_CANCELED возвращает тот же итог.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC02-03
      - FR-UC04-01
      - FR-UC01-05
      parameters:
      - $ref: '#/components/parameters/application_id'
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationCancellation'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна в текущем состоянии.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - APPLICATION_CANCELLATION_UNAVAILABLE
  /applications/{application_id}/offer:
    get:
      operationId: getOffer
      tags:
      - CUSTOMER
      summary: Прочитать предложение и сведения об ИУ
      description: До публикации видна подготовка ИУ. Событие публикации фиксирует первый момент предоставления и дедлайн.
        Чтение их не меняет. При обязательном предупреждении о ПДН присутствует pdn_notice.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC05-01
      - FR-UC05-02
      - FR-UC05-03
      parameters:
      - $ref: '#/components/parameters/application_id'
      responses:
        '200':
          description: Подготовка либо сведения о предоставленных ИУ.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/OfferPreparing'
                - $ref: '#/components/schemas/TermsAvailable'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна в текущем состоянии.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - OFFER_NOT_AVAILABLE
  /applications/{application_id}/terms/{terms_id}/document:
    get:
      operationId: getIndividualTermsDocument
      tags:
      - CUSTOMER
      summary: Получить экземпляр ИУ
      description: Возвращает точные неизменяемые байты опубликованного PDF для данного terms_id.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC05-02
      - FR-UC05-03
      parameters:
      - $ref: '#/components/parameters/application_id'
      - $ref: '#/components/parameters/terms_id'
      responses:
        '200':
          description: Предоставленный экземпляр ИУ.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
  /applications/{application_id}/terms/{terms_id}/pdn-notice-acknowledgement:
    put:
      operationId: acknowledgePdnNotice
      tags:
      - CUSTOMER
      summary: Подтвердить показ предупреждения
      description: Доверенное МП вызывает операцию после фактического показа текста. Сервер фиксирует первый момент показа
        для экземпляра ИУ и актуальной версии. Повтор возвращает исходный момент.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC05-02
      parameters:
      - $ref: '#/components/parameters/application_id'
      - $ref: '#/components/parameters/terms_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                notice_version:
                  type: string
                  minLength: 1
              required:
              - notice_version
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeAcknowledgement'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна в текущем состоянии.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - PDN_NOTICE_NOT_REQUIRED
                      - NOTICE_VERSION_MISMATCH
                      - OFFER_EXPIRED
  /applications/{application_id}/signing-attempts:
    post:
      operationId: startSigningAttempt
      tags:
      - CUSTOMER
      summary: Начать подписание
      description: Успех открывает одну попытку и инициирует первое SMS. Проверяется действующий дедлайн и, при необходимости,
        показ предупреждения. Повтор принятого запроса возвращает исходную попытку. Другой ключ при открытой попытке вторую
        попытку не создаёт. Её можно найти в текущей заявке.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC01-01
      - FR-UC01-03
      - FR-UC05-02
      parameters:
      - $ref: '#/components/parameters/application_id'
      - $ref: '#/components/parameters/idempotency_key'
      responses:
        '201':
          description: Попытка открыта.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptReceipt'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна или ключ уже использован для другого тела.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - OFFER_EXPIRED
                      - TERMS_NOT_PROVIDED
                      - PDN_NOTICE_NOT_ACKNOWLEDGED
                      - SIGNING_ALREADY_IN_PROGRESS
                      - APPLICATION_STATE_CONFLICT
                      - IDEMPOTENCY_KEY_REUSED
  /applications/{application_id}/signing-attempts/{attempt_id}:
    get:
      operationId: getSigningAttempt
      tags:
      - CUSTOMER
      summary: Проверить состояние попытки
      description: VERIFYING означает, что проверка принята и её итог неизвестен. В SIGNED присутствует contract_id. В CLOSED
        присутствует close_reason. Старую попытку можно прочитать отдельно от новой.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC01-02
      - FR-UC01-03
      - FR-UC01-04
      parameters:
      - $ref: '#/components/parameters/application_id'
      - $ref: '#/components/parameters/attempt_id'
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningAttemptView'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
  /applications/{application_id}/signing-attempts/{attempt_id}/sms-resends:
    post:
      operationId: resendSigningSms
      tags:
      - CUSTOMER
      summary: Запросить повторное SMS
      description: Максимум две повторные команды. Повтор с тем же ключом не создаёт второй команды и не расходует лимит повторно.
        Срок попытки сохраняется.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC01-01
      - FR-UC01-04
      parameters:
      - $ref: '#/components/parameters/application_id'
      - $ref: '#/components/parameters/attempt_id'
      - $ref: '#/components/parameters/idempotency_key'
      responses:
        '202':
          description: Команда отправки принята. Доставка SMS не подтверждена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmsReceipt'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна или ключ уже использован для другого тела.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - OFFER_EXPIRED
                      - SIGNING_ATTEMPT_EXPIRED
                      - SIGNING_ATTEMPT_NOT_CURRENT
                      - SIGNING_ATTEMPT_CLOSED
                      - VERIFICATION_IN_PROGRESS
                      - SMS_RESEND_LIMIT
                      - IDEMPOTENCY_KEY_REUSED
  /applications/{application_id}/signing-attempts/{attempt_id}/verification:
    post:
      operationId: verifySigningCode
      tags:
      - CUSTOMER
      summary: Передать код на проверку
      description: 202 означает принятие проверки, итог читается отдельным запросом. Неверный или просроченный SMS-код виден
        как CLOSED с причиной. Повтор с тем же ключом возвращает исходное подтверждение принятия. Сессия и устройство берутся
        из токена. Право на коммит сохраняется у своевременной проверки под блокировкой.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC01-02
      - FR-UC01-03
      - FR-UC01-04
      parameters:
      - $ref: '#/components/parameters/application_id'
      - $ref: '#/components/parameters/attempt_id'
      - $ref: '#/components/parameters/idempotency_key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 32
                  writeOnly: true
              required:
              - code
      responses:
        '202':
          description: Проверка принята. Результат ещё не сообщён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationReceipt'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна или ключ уже использован для другого тела.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - OFFER_EXPIRED
                      - SIGNING_ATTEMPT_EXPIRED
                      - SIGNING_ATTEMPT_NOT_CURRENT
                      - SIGNING_ATTEMPT_CLOSED
                      - VERIFICATION_IN_PROGRESS
                      - IDEMPOTENCY_KEY_REUSED
  /contracts/{contract_id}:
    get:
      operationId: getOwnContract
      tags:
      - CUSTOMER
      summary: Прочитать свой договор
      description: Время окончания охлаждения и подтверждённое время зачисления передаются раздельно.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC06-01
      - FR-UC06-02
      - FR-UC01-06
      - FR-UC01-08
      - FR-UC01-09
      parameters:
      - $ref: '#/components/parameters/contract_id'
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractView'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
  /contracts/{contract_id}/withdrawal:
    post:
      operationId: withdrawInMobile
      tags:
      - CUSTOMER
      summary: Отказаться от получения кредита
      description: Отказ допустим из COOLING_OFF. Побеждает первый зафиксированный переход. Для уже принятого отказа повтор
        возвращает тот же результат.
      x-roles:
      - CUSTOMER
      x-requirements:
      - FR-UC01-05
      parameters:
      - $ref: '#/components/parameters/contract_id'
      responses:
        '200':
          description: Операция выполнена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractCancellation'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Отказ недоступен. Возвращается текущий статус Договора.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalUnavailable'
  /contact-center/customers/{customer_id}/status:
    get:
      operationId: getContactCenterStatus
      tags:
      - CONTACT_CENTER
      summary: Посмотреть статус в КЦ
      description: Уполномоченный оператор ищет по учебному customer_id. Просмотр доступен до идентификации клиента. Возвращаются
        статусы и сроки без кода отказа, балла скоринга и реквизитов счёта.
      x-roles:
      - CONTACT_CENTER
      x-requirements:
      - FR-UC06-01
      - FR-UC06-02
      parameters:
      - $ref: '#/components/parameters/customer_id'
      responses:
        '200':
          description: Операция выполнена.
