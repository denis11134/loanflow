          $ref: '#/components/schemas/NullablePositiveAmountMinor'
        requested_term_months:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
      minProperties: 1
    ApplicationView:
      type: object
      additionalProperties: false
      properties:
        application_id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        created_at:
          type: string
          format: date-time
          description: Момент времени с явным смещением.
        submitted_at:
          type: string
          format: date-time
          description: Момент времени с явным смещением.
          nullable: true
        requested_amount_minor:
          $ref: '#/components/schemas/NullablePositiveAmountMinor'
        requested_term_months:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
        offer_availability:
          type: string
          enum:
          - NONE
          - PREPARING
          - AVAILABLE
          - EXPIRED
        offer_expires_at:
          type: string
          format: date-time
          description: Момент времени с явным смещением.
          nullable: true
        active_attempt_id:
          type: string
          format: uuid
          nullable: true
        contract_id:
          type: string
          format: uuid
          nullable: true
        display_reason:
          type: string
          description: Причина для клиента. При отсутствии финального отказа передаётся null.
          enum:
          - null
          - REFUSED
          - SELF_BAN
          - CREDIT_REPORT_CONSENT_REQUIRED
          nullable: true
        available_actions:
          type: array
          items:
            type: string
            enum:
            - EDIT_DRAFT
            - SUBMIT
            - CANCEL_APPLICATION
            - OPEN_TERMS
            - START_SIGNING
      required:
      - application_id
      - status
      - created_at
      - submitted_at
      - requested_amount_minor
      - requested_term_months
      - offer_availability
      - offer_expires_at
      - active_attempt_id
      - contract_id
      - display_reason
      - available_actions
      allOf:
      # Условие выполнено, если каждое действие разрешено для текущего состояния.
      - anyOf:
        - properties:
            status:
              enum: [DRAFT]
        - properties:
            available_actions:
              items:
                not:
                  enum: [EDIT_DRAFT, SUBMIT]
      - anyOf:
        - properties:
            status:
              enum: [DRAFT, SCORING, UNDERWRITING, APPROVED]
        - properties:
            available_actions:
              items:
                not:
                  enum: [CANCEL_APPLICATION]
      - anyOf:
        - properties:
            offer_availability:
              enum: [AVAILABLE, EXPIRED]
        - properties:
            available_actions:
              items:
                not:
                  enum: [OPEN_TERMS]
      - anyOf:
        - properties:
            status:
              enum: [APPROVED]
            offer_availability:
              enum: [AVAILABLE]
            offer_expires_at:
              type: string
            active_attempt_id:
              enum: [null]
        - properties:
            available_actions:
              items:
                not:
                  enum: [START_SIGNING]
      - anyOf:
        - properties:
            status:
              not:
                enum: [SCORING]
        - properties:
            submitted_at:
              type: string
      - anyOf:
        - properties:
            status:
              not:
                enum: [CONTRACT_SIGNED]
        - properties:
            contract_id:
              type: string
