          description: Окончательный результат сохранён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FinalReconciliation'
        '202':
          description: Команда закрытия принята.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClosureReceipt'
        '400':
          $ref: '#/components/responses/Http400'
        '401':
          $ref: '#/components/responses/Http401'
        '403':
          $ref: '#/components/responses/Http403'
        '404':
          $ref: '#/components/responses/Http404'
        '503':
          $ref: '#/components/responses/Http503'
        '409':
          description: Команда недоступна в текущем состоянии.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Error'
                - type: object
                  properties:
                    code:
                      type: string
                      enum:
                      - CLOSURE_NOT_AUTHORIZED_BY_READ
                      - RECONCILIATION_NOT_OPEN
components:
  securitySchemes:
    StandBearer:
      type: http
      scheme: bearer
      description: Токен доверенного контекста учебного стенда.
  parameters:
    application_id:
      name: application_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    terms_id:
      name: terms_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    attempt_id:
      name: attempt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    contract_id:
      name: contract_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    customer_id:
      name: customer_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    instruction_id:
      name: instruction_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    read_seq:
      name: read_seq
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    idempotency_key:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Один ключ на одно намерение. После потери ответа повторить тот же запрос с тем же ключом.
    identification_token:
      name: X-Identification-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
      description: Подтверждение из доверенной учебной идентификации КЦ, привязанное к оператору, сессии, клиенту и Договору.
  responses:
    Http400:
      description: Некорректный формат запроса.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - INVALID_REQUEST
    Http401:
      description: Необходим действительный токен.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - UNAUTHENTICATED
    Http403:
      description: Недостаточно прав.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - FORBIDDEN
    Http404:
      description: Ресурс отсутствует или недоступен вызывающему.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - NOT_FOUND
    Http503:
      description: Сервис недоступен. Этот ответ не подтверждает принятие или отклонение команды.
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/Error'
            - type: object
              properties:
                code:
                  type: string
                  enum:
                  - SERVICE_UNAVAILABLE
  schemas:
    ApplicationStatus:
      type: string
      enum:
      - DRAFT
      - SCORING
      - UNDERWRITING
      - APPROVED
      - SIGNING_IN_PROGRESS
      - BANK_REJECTED
      - CLIENT_CANCELED
      - OFFER_EXPIRED
      - SYSTEM_ERROR
      - CONTRACT_SIGNED
    ContractStatus:
      type: string
      enum:
      - COOLING_OFF
      - CANCELED_BY_CLIENT
      - DISBURSEMENT_PROCESSING
      - DISBURSED
      - DISBURSEMENT_FAILED
    Error:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
        application_status:
          $ref: '#/components/schemas/ApplicationStatus'
        contract_status:
          $ref: '#/components/schemas/ContractStatus'
      required:
      - code
      - message
    WithdrawalUnavailable:
      allOf:
      - $ref: '#/components/schemas/Error'
      - type: object
        required:
        - contract_status
        properties:
          code:
            type: string
            enum:
            - WITHDRAWAL_UNAVAILABLE
    PositiveAmountMinor:
      type: string
      description: Положительная сумма в копейках. Максимум 9223372036854775807.
      # Для 19 цифр ветви соответствуют первому разряду меньше верхней границы.
      pattern: '^(?:[1-9][0-9]{0,17}|[1-8][0-9]{18}|9[01][0-9]{17}|92[01][0-9]{16}|922[0-2][0-9]{15}|9223[0-2][0-9]{14}|92233[0-6][0-9]{13}|922337[01][0-9]{12}|92233720[0-2][0-9]{10}|922337203[0-5][0-9]{9}|9223372036[0-7][0-9]{8}|92233720368[0-4][0-9]{7}|922337203685[0-3][0-9]{6}|9223372036854[0-6][0-9]{5}|92233720368547[0-6][0-9]{4}|922337203685477[0-4][0-9]{3}|9223372036854775[0-7][0-9]{2}|922337203685477580[0-7])(?![\s\S])'
    NullablePositiveAmountMinor:
      type: string
      nullable: true
      anyOf:
      - $ref: '#/components/schemas/PositiveAmountMinor'
      - type: string
        nullable: true
        enum: [null]
    DraftInput:
      type: object
      additionalProperties: false
      properties:
        requested_amount_minor:
          $ref: '#/components/schemas/NullablePositiveAmountMinor'
        requested_term_months:
          type: integer
          minimum: 1
          maximum: 2147483647
          nullable: true
    DraftPatch:
      type: object
      additionalProperties: false
      properties:
