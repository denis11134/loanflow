  /reconciliation/instructions/{instruction_id}/closure:
    put:
      operationId: requestAbsClosure
      tags:
      - RECONCILIATION_OPERATOR
      summary: Запросить или повторить закрытие
      description: Для первой команды требуется последнее чтение NOT_FOUND или PENDING. Принятая команда сохраняется до вызова
        АБС. Повтор уполномоченным оператором использует ту же команду без нового чтения. Если итог уже сохранён, LoanFlow
        возвращает его без обращения в АБС. 202 означает, что команда сохранена, а окончательного итога пока нет.
      x-roles:
      - RECONCILIATION_OPERATOR
      x-requirements:
      - FR-UC07-01
      - FR-UC07-02
      - FR-UC01-09
      parameters:
      - $ref: '#/components/parameters/instruction_id'
      responses:
