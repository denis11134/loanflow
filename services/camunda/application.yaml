# Только локальный учебный запуск Camunda 8 Run 8.10.9.
server:
  address: 127.0.0.1
management:
  server:
    address: 127.0.0.1
    port: ${LOANFLOW_CAMUNDA_MANAGEMENT_PORT:9600}
camunda:
  api:
    grpc:
      address: 127.0.0.1
      port: ${LOANFLOW_CAMUNDA_GRPC_PORT:26500}
  cluster:
    network:
      host: 127.0.0.1
      advertised-host: 127.0.0.1
      command-api:
        port: ${LOANFLOW_CAMUNDA_COMMAND_PORT:26501}
      internal-api:
        port: ${LOANFLOW_CAMUNDA_INTERNAL_PORT:26502}
  data:
    primary-storage:
      directory: ${LOANFLOW_CAMUNDA_DATA:./camunda-data}/zeebe
      rocksdb:
        memory-allocation-strategy: BROKER
        memory-limit: ${LOANFLOW_CAMUNDA_ROCKSDB_MEMORY:128MB}
      disk:
        free-space:
          processing: 256MB
          replication: 128MB
    secondary-storage:
      type: rdbms
      rdbms:
        url: jdbc:h2:file:${LOANFLOW_CAMUNDA_DATA:./camunda-data}/h2db
        username: sa
        password:
        flushInterval: PT0.5S
  security:
    initialization:
      users:
        - username: demo
          password: demo
          name: Demo
          email: demo@example.com
      defaultRoles:
        admin:
          users:
            - demo
    authentication:
      method: BASIC
      unprotected-api: true
    authorizations:
      enabled: false
  mcp:
    enabled: false
  process-instance-creation:
    business-id-uniqueness-enabled: true
  system:
    cpu-thread-count: 2
    io-thread-count: 2
